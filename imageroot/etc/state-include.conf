#
# Termix state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# state/environment is always included.
#
# termix.env holds the OIDC settings, client secret included: restore-module
# reads it back to call configure-module.
#
# The volume holds the encrypted database and its keys (.env): Termix writes
# the database with an atomic rename, so a copy taken while it runs is
# consistent.
#
state/termix.env
volumes/termix-data
